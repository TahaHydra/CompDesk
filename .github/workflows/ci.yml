name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: compdesk
          POSTGRES_PASSWORD: compdesk_ci
          POSTGRES_DB: compdesk_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compdesk -d compdesk_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://compdesk:compdesk_ci@localhost:5432/compdesk_ci?schema=public
      AUTH_URL: http://localhost:3000
      AUTH_SECRET: ci-only-stable-auth-secret-32-characters
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate:prod
      - run: npm run verify