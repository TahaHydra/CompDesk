name: compdesk-dev

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: compdesk_db
      POSTGRES_USER: compdesk
      POSTGRES_PASSWORD: compdesk_dev_only
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - compdesk_dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U compdesk -d compdesk_db']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  compdesk_dev_pgdata: