name: compdesk-external-db

x-app-environment: &app-environment
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL for external PostgreSQL is required}
  DATABASE_CA_FILE: ${DATABASE_CA_FILE:-}
  AUTH_URL: ${AUTH_URL:?AUTH_URL is required}
  AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
  APP_SETTINGS_ENCRYPTION_KEY: ${APP_SETTINGS_ENCRYPTION_KEY:?APP_SETTINGS_ENCRYPTION_KEY is required}
  APP_SETTINGS_ENCRYPTION_KEY_PREVIOUS: ${APP_SETTINGS_ENCRYPTION_KEY_PREVIOUS:-}
  TRUST_PROXY: ${TRUST_PROXY:-false}
  LOGIN_LOCAL_ENABLED: ${LOGIN_LOCAL_ENABLED:-true}
  LOGIN_MICROSOFT_ENABLED: ${LOGIN_MICROSOFT_ENABLED:-false}
  AZURE_AD_CLIENT_ID: ${AZURE_AD_CLIENT_ID:-}
  AZURE_AD_CLIENT_SECRET: ${AZURE_AD_CLIENT_SECRET:-}
  AZURE_AD_TENANT_ID: ${AZURE_AD_TENANT_ID:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_FROM: ${SMTP_FROM:-}
  ATTACHMENT_STORAGE_DIR: /app/storage/attachments
  UPLOAD_MAX_SIZE_MB: ${UPLOAD_MAX_SIZE_MB:-10}
  ATTACHMENT_MAX_FILES_PER_TICKET: ${ATTACHMENT_MAX_FILES_PER_TICKET:-20}
  ATTACHMENT_MAX_BYTES_PER_TICKET: ${ATTACHMENT_MAX_BYTES_PER_TICKET:-104857600}
  ATTACHMENT_GLOBAL_MAX_BYTES: ${ATTACHMENT_GLOBAL_MAX_BYTES:-10737418240}
  TEMP_ATTACHMENT_TTL_HOURS: ${TEMP_ATTACHMENT_TTL_HOURS:-24}
  TEMP_ATTACHMENT_MAX_FILES_PER_USER: ${TEMP_ATTACHMENT_MAX_FILES_PER_USER:-20}
  TEMP_ATTACHMENT_MAX_BYTES_PER_USER: ${TEMP_ATTACHMENT_MAX_BYTES_PER_USER:-104857600}
  CLAMAV_HOST: ${CLAMAV_HOST:-}
  CLAMAV_PORT: ${CLAMAV_PORT:-3310}
  CLAMAV_TIMEOUT_MS: ${CLAMAV_TIMEOUT_MS:-10000}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  NODE_ENV: production

services:
  migrate:
    image: ${COMPDESK_IMAGE:-ghcr.io/tahahydra/compdesk}:${COMPDESK_VERSION:-0.0.0-local}
    restart: 'no'
    environment: *app-environment
    command: ['sh', '-c', 'node scripts/validate-runtime-env.mjs && ./node_modules/.bin/prisma migrate deploy && node scripts/migrate-private-attachments.mjs']
    volumes:
      - ./.compdesk:/app/config:ro
      - uploads:/app/public/uploads
      - attachments:/app/storage/attachments

  app:
    image: ${COMPDESK_IMAGE:-ghcr.io/tahahydra/compdesk}:${COMPDESK_VERSION:-0.0.0-local}
    restart: unless-stopped
    init: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - '${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000'
    environment: *app-environment
    volumes:
      - ./.compdesk:/app/config:ro
      - uploads:/app/public/uploads
      - attachments:/app/storage/attachments
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s

volumes:
  uploads:
    name: ${UPLOADS_VOLUME_NAME:-compdesk_uploads}
  attachments:
    name: ${ATTACHMENTS_VOLUME_NAME:-compdesk_attachments}
