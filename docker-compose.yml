services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: excodesk
      POSTGRES_USER: excodesk
      POSTGRES_PASSWORD: excodesk_pass
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U excodesk' ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://excodesk:excodesk_pass@db:5432/excodesk?schema=public
      AUTH_URL: ${AUTH_URL:?AUTH_URL is required}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      APP_SETTINGS_ENCRYPTION_KEY: ${APP_SETTINGS_ENCRYPTION_KEY:-}
      APP_SETTINGS_ENCRYPTION_KEY_PREVIOUS: ${APP_SETTINGS_ENCRYPTION_KEY_PREVIOUS:-}
      AZURE_AD_CLIENT_ID: ${AZURE_AD_CLIENT_ID:-}
      AZURE_AD_CLIENT_SECRET: ${AZURE_AD_CLIENT_SECRET:-}
      AZURE_AD_TENANT_ID: ${AZURE_AD_TENANT_ID:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.office365.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-CompDesk <noreply@example.com>}
      NODE_ENV: production
    volumes:
      - uploads:/app/public/uploads
      - attachments:/app/storage/attachments

volumes:
  pgdata:
    name: ${POSTGRES_VOLUME_NAME:-compdesk_pgdata}
    external: ${POSTGRES_VOLUME_EXTERNAL:-false}
  uploads:
    name: ${UPLOADS_VOLUME_NAME:-compdesk_uploads}
  attachments:
    name: ${ATTACHMENTS_VOLUME_NAME:-compdesk_attachments}
